<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日文學習助手 (N3~N5)</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --warning-color: #e67e22;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: none;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            color: #666;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        /* 單字卡風格 */
        .word-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #fafafa;
        }

        .word-header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            flex-wrap: wrap;
        }

        .kanji { font-size: 32px; font-weight: bold; color: #333; }
        .reading { font-size: 20px; color: #666; }
        .badge { background: #e0e0e0; padding: 3px 8px; border-radius: 4px; font-size: 12px; }

        /* 發音按鈕樣式 */
        .audio-btn {
            background-color: #e8f4fd;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            margin-left: 5px;
        }
        .audio-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }
        .audio-btn-sm {
            width: 26px;
            height: 26px;
            font-size: 12px;
        }

        .section-title { font-weight: bold; margin-top: 15px; color: var(--primary-color); }
        .example-list { padding-left: 20px; margin: 5px 0; }
        .example-item { margin-bottom: 12px; }
        .grammar-note { font-size: 13px; color: #666; font-style: italic; }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button.action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-master { background-color: var(--success-color); color: white; }
        .btn-review { background-color: var(--warning-color); color: white; }
        .btn-submit { background-color: var(--primary-color); color: white; margin-top: 10px; }
        .btn-secondary { background-color: #7f8c8d; color: white; }

        /* 測驗區風格 */
        .quiz-container { margin-top: 15px; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .feedback { margin-top: 10px; font-weight: bold; }

        /* 統計與備份區 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }
        .stat-box {
            background: #f0f4f8;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-num { font-size: 24px; font-weight: bold; color: var(--primary-color); }

        .backup-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #ddd;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('learn', this)">今日學習</button>
        <button class="tab-btn" onclick="switchTab('quiz', this)">隨機測驗</button>
        <button class="tab-btn" onclick="switchTab('stats', this)">學習狀況與備份</button>
    </div>

    <!-- 1. 每日學習區 -->
    <div id="learn-section" class="view-section active">
        <div id="learning-content">
            <!-- 動態渲染單字卡片 -->
        </div>
    </div>

    <!-- 2. 隨機測驗區 -->
    <div id="quiz-section" class="view-section">
        <div class="quiz-container" id="quiz-content">
            <!-- 動態渲染測驗內容 -->
        </div>
    </div>

    <!-- 3. 學習狀況與資料匯入匯出區 -->
    <div id="stats-section" class="view-section">
        <h3>📊 學習統計</h3>
        <div class="stats-grid">
            <div class="stat-box">
                <div>今天學習單字數</div>
                <div class="stat-num" id="stat-today">0</div>
            </div>
            <div class="stat-box">
                <div>累積已掌握單字</div>
                <div class="stat-num" id="stat-mastered">0</div>
            </div>
        </div>

        <div class="backup-section">
            <h3>💾 資料備份與跨電腦同步</h3>
            <p style="font-size: 14px; color: #666;">你可以將學習紀錄匯出成檔案，帶到其他電腦上匯入接續學習。</p>
            <div class="btn-group">
                <button class="action-btn btn-secondary" onclick="exportData()">📥 匯出學習紀錄</button>
                <button class="action-btn btn-secondary" onclick="document.getElementById('import-file').click()">📤 匯入學習紀錄</button>
                <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importData(event)">
            </div>
        </div>
    </div>
</div>
